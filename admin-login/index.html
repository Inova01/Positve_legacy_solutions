<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Positive Legacy Solutions LLC</title>
  <meta name="description" content="Admin dashboard access for Positive Legacy Solutions." />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/custom.css" />
</head>
<body class="bg-cream-50">
  <header class="site-header bg-white py-4 shadow-sm">
    <div class="max-w-6xl mx-auto px-5 flex items-center justify-between gap-4">
      <a href="../index.html" class="flex items-center gap-3">
        <span class="inline-flex items-center justify-center w-11 h-11 rounded-lg bg-navy-900">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C9A227" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 L17 7"/><path d="M9 7 h8 v8"/></svg>
        </span>
        <span class="leading-tight">
          <span class="block font-display font-bold text-xl text-navy-900">PLS</span>
          <span class="block text-[10px] tracking-widest uppercase text-gray-body">Positive Legacy Solutions</span>
        </span>
      </a>
      <a href="../index.html" class="btn-ghost" style="color:var(--navy-900);border-color:var(--navy-900);">Return Home</a>
    </div>
  </header>

  <main class="min-h-[calc(100vh-84px)] grid place-items-center px-5 py-16 bg-navy-900 relative overflow-hidden">
    <div class="absolute w-[420px] h-[420px] rounded-full border border-white/10 -right-36 -top-32" aria-hidden="true"></div>
    <div class="absolute w-[280px] h-[280px] rounded-full border border-gold-500/20 -left-24 -bottom-20" aria-hidden="true"></div>
    <section class="relative z-10 w-full max-w-2xl rounded-3xl border border-white/10 bg-white/[.06] p-8 md:p-14 text-center shadow-2xl backdrop-blur-sm">
      <span class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gold-500 text-navy-900 mb-8">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </span>
      <p class="eyebrow mb-3">Admin portal</p>
      <h1 class="font-display font-bold text-4xl md:text-5xl text-white">Manage blog posts, PDFs and client messages.</h1>
      <p class="mt-6 text-gray-dark text-lg leading-relaxed">This private area is for Positive Legacy Solutions administrators only.</p>
      <form class="mt-9 text-left space-y-4" action="#" method="post">
        <label class="block">
          <span class="block text-sm font-semibold text-gray-dark mb-2">Email</span>
          <input type="email" name="email" autocomplete="username" required class="w-full rounded-xl border border-white/10 bg-white/95 px-4 py-3 text-navy-900 outline-none focus:border-gold-500" placeholder="admin@positivelegacysolutions.com" />
        </label>
        <label class="block">
          <span class="block text-sm font-semibold text-gray-dark mb-2">Password</span>
          <input type="password" name="password" autocomplete="current-password" required class="w-full rounded-xl border border-white/10 bg-white/95 px-4 py-3 text-navy-900 outline-none focus:border-gold-500" placeholder="Enter password" />
        </label>
        <button type="submit" class="btn-pill w-full justify-center">Login <span class="arrow">-&gt;</span></button>
      </form>
      <p class="mt-8 text-sm text-gray-dark">Admin access is private. Contact the site manager if you need dashboard permission.</p>
    </section>
  </main>
</body>
</html>
